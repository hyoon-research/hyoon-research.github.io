# -----------------------------------------------------------------------------
# Third Party Libraries Configuration (Required by al-folio)
# -----------------------------------------------------------------------------
third_party_libraries:
  google_fonts:
    fonts: "Roboto:300,400,500,700|Roboto+Slab:100,300,400,500,700|Material+Icons"
  highlightjs:
    theme: github
  mathjax:
    enabled: true
  mermaid:
    enabled: true
  bootstrap-table:
    enabled: true

# -----------------------------------------------------------------------------
# Scholar (BibTeX / Publications) Configuration
# -----------------------------------------------------------------------------
scholar:
  last_name: [Yoon]
  first_name: [Hyun]
  style: apa
  locale: en
  sort_by: year, month
  order: descending
  bibliography: papers.bib
  bibliography_template: bib
  replace_repository_information: true

# -----------------------------------------------------------------------------
# ImageMagick & Assets Configuration
# -----------------------------------------------------------------------------
imagemagick:
  enabled: true
  widths: [480, 800, 1400]
  input_directories: ["assets/img"]
  output_directory: "assets/img"

# -----------------------------------------------------------------------------
# Build & Feature Settings
# -----------------------------------------------------------------------------
enable_tooltips: true
enable_google_analytics: false
enable_masonry: true

markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

plugins:
  - jekyll-archives
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-imagemagick
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-scholar
  - jekyll-sitemap
  - jekyll-toc
  - jemoji
