# -----------------------------------------------------------------------------
# Third Party Libraries (Required URL Schema by al-folio engine)
# -----------------------------------------------------------------------------
third_party_libraries:
  academicons:
    url:
      css: "https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"
  bootstrap:
    url:
      css: "https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css"
      js: "https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"
  fontawesome:
    url:
      css: "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  google_fonts:
    url:
      css: "https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Slab:100,300,400,500,700|Material+Icons"
  jquery:
    url:
      js: "https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"
  mathjax:
    url:
      js: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
  mdbootstrap:
    url:
      css: "https://cdnjs.cloudflare.com/ajax/libs/mdbootstrap/4.19.1/css/mdb.min.css"
      js: "https://cdnjs.cloudflare.com/ajax/libs/mdbootstrap/4.19.1/js/mdb.min.js"

# -----------------------------------------------------------------------------
# Scholar (BibTeX Bibliography) Configuration
# -----------------------------------------------------------------------------
scholar:
  last_name: [Yoon]
  first_name: [Hyun]
  style: apa
  locale: en
  sort_by: year, month
  order: descending
  bibliography: papers.bib
  bibliography_template: bib
  replace_repository_information: true

# -----------------------------------------------------------------------------
# ImageMagick Configuration
# -----------------------------------------------------------------------------
imagemagick:
  enabled: true
  widths: [480, 800, 1400]
  input_directories: ["assets/img"]
  output_directory: "assets/img"

# -----------------------------------------------------------------------------
# Collections & External Services
# -----------------------------------------------------------------------------
external_services:
  github_readme_stats_url: https://github-stats-extended.vercel.app

collections:
  news:
    output: true
    permalink: /news/:path/
  projects:
    output: true
    permalink: /projects/:path/

# -----------------------------------------------------------------------------
# Build Engine & Plugins
# -----------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

plugins:
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-imagemagick
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-scholar
  - jekyll-sitemap
  - jekyll-toc
  - jemoji
