# -----------------------------------------------------------------------------
# Site Settings
# -----------------------------------------------------------------------------
title: "blank" # blank로 두면 first_name + last_name을 조합하여 자동 생성합니다
first_name: Hyun
middle_name:
last_name: Yoon
position: Postdoctoral Scholar
affiliation: University of California, Berkeley
affiliation_url: "https://ce.berkeley.edu/"
email: h_yoon@berkeley.edu
description: "Postdoctoral Scholar in Civil and Environmental Engineering at UC Berkeley."
keywords: "Environmental Geochemistry, Biogeochemistry, PFAS, Machine Learning, Contaminant Fate, Groundwater"

url: "https://supremehyun12345.github.io"
baseurl: ""

# -----------------------------------------------------------------------------
# Navigation Bar Settings
# -----------------------------------------------------------------------------
nav_order:
  - about
  - research
  - publications
  - software

# -----------------------------------------------------------------------------
# Social Integration
# -----------------------------------------------------------------------------
github_username: supremehyun12345
linkedin_username: hyun-yoon-ba10a18b
scholar_userid: OD69EnkAAAAJ

# -----------------------------------------------------------------------------
# Theme & Footer Settings
# -----------------------------------------------------------------------------
theme: al-folio
icon: ⚛️
lang: en

header_text:
footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme.

max_author_limit: 3
more_authors_animation_delay: 10

enable_tooltips: true
enable_google_analytics: false
enable_masonry: true

# -----------------------------------------------------------------------------
# Third Party Libraries (Required by al-folio engine)
# -----------------------------------------------------------------------------
third_party_libraries:
  google_fonts:
    fonts: "Roboto:300,400,500,700|Roboto+Slab:100,300,400,500,700|Material+Icons"
  highlightjs:
    theme: github
  mathjax:
    enabled: true
  mermaid:
    enabled: true
  bootstrap-table:
    enabled: true
  fontawesome:
    version: "6.5.1"
  academicons:
    version: "1.9.4"
  scholar-icons:
    version: "1.0.0"
  tocbot:
    enabled: true

# -----------------------------------------------------------------------------
# Scholar (BibTeX Bibliography) Configuration
# -----------------------------------------------------------------------------
scholar:
  last_name: [Yoon]
  first_name: [Hyun]
  style: apa
  locale: en
  sort_by: year, month
  order: descending
  bibliography: papers.bib
  bibliography_template: bib
  replace_repository_information: true

# -----------------------------------------------------------------------------
# ImageMagick & Media Generation
# -----------------------------------------------------------------------------
imagemagick:
  enabled: true
  widths: [480, 800, 1400]
  input_directories: ["assets/img"]
  output_directory: "assets/img"

# -----------------------------------------------------------------------------
# External Services & Repositories
# -----------------------------------------------------------------------------
external_services:
  github_readme_stats_url: https://github-stats-extended.vercel.app

collections:
  news:
    output: true
    permalink: /news/:path/
  projects:
    output: true
    permalink: /projects/:path/

# -----------------------------------------------------------------------------
# Build Engine & Plugins
# -----------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

plugins:
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-imagemagick
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-scholar
  - jekyll-sitemap
  - jekyll-toc
  - jemoji
