# -----------------------------------------------------------------------------
# Display & Theme Settings
# -----------------------------------------------------------------------------
theme: al-folio
icon: ⚛️
lang: en

header_text:
footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme.

max_author_limit: 3
more_authors_animation_delay: 10

enable_tooltips: true
enable_google_analytics: false
enable_masonry: true

# -----------------------------------------------------------------------------
# Third Party Libraries & Scholar
# -----------------------------------------------------------------------------
third_party_libraries:
  google_fonts:
    fonts: "Roboto:300,400,500,700|Roboto+Slab:100,300,400,500,700|Material+Icons"
  highlightjs:
    theme: github
  mathjax:
    enabled: true
  mermaid:
    enabled: true
  bootstrap-table:
    enabled: true

scholar:
  last_name: [Yoon]
  first_name: [Hyun]
  style: apa
  locale: en
  sort_by: year, month
  order: descending
  bibliography: papers.bib
  bibliography_template: bib
  replace_repository_information: true

imagemagick:
  enabled: true
  widths: [480, 800, 1400]
  input_directories: ["assets/img"]
  output_directory: "assets/img"

# -----------------------------------------------------------------------------
# Build Settings & Plugins
# -----------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

plugins:
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-imagemagick
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-scholar
  - jekyll-sitemap
  - jekyll-toc
  - jemoji
